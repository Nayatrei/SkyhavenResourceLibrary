name: Interface checks
on:
  pull_request:
    paths: ['assets/**', 'index.html', 'package*.json', '.github/workflows/interface-checks.yml']
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: for file in assets/*.mjs; do node --check "$file"; done
