name: Interface checks
on:
  pull_request:
    paths: ['assets/**', 'branding/**', 'tools/build_branding.py', 'tools/publish_character_art.py', 'tools/test_publish_character_art.py', 'index.html', 'package*.json', '.github/workflows/interface-checks.yml']
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-character-art.txt
      - run: python -m unittest discover -s tools -p test_publish_character_art.py
      - run: for file in assets/*.mjs; do node --check "$file"; done
